<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>复述肌 · Recall</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#f2f2f7;
    font-family:-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    color:#000;
    overscroll-behavior:none;
  }
  #app { max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:40px; }
  header { padding:18px 16px 8px; }
  header .navrow { height:32px; display:flex; align-items:center; }
  #backBtn {
    background:none; border:none; color:#007aff; font-size:17px; cursor:pointer;
    padding:4px 8px 4px 0; display:none;
  }
  h1 { font-size:34px; font-weight:700; margin-top:4px; }
  .code { text-align:center; color:#8e8e93; font-size:12px; letter-spacing:2px; margin:6px 0 2px; }

  .card { background:#fff; border-radius:12px; margin:12px 16px; overflow:hidden; }
  .divider { height:0.5px; background:#e5e5ea; margin-left:16px; }

  .row-wrap { position:relative; overflow:hidden; }
  .row {
    position:relative; z-index:2; background:#fff; height:54px; display:flex; align-items:center;
    padding:0 16px; transition:transform .2s; cursor:pointer; user-select:none;
  }
  .row .left { flex:1; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .count { color:#8e8e93; font-size:17px; margin-right:8px; }
  .row .chev { color:#c7c7cc; font-size:20px; }
  .delbtn {
    position:absolute; right:0; top:0; bottom:0; width:84px; z-index:1;
    background:#ff3b30; color:#fff; border:none; font-size:16px; cursor:pointer;
  }

  .addbox {
    margin:12px 16px; border:1.5px dashed #c7c7cc; border-radius:12px; padding:14px;
    color:#007aff; text-align:center; font-size:16px; cursor:pointer; background:transparent;
  }

  .empty { color:#8e8e93; text-align:center; padding:40px 0; font-size:15px; }

  /* practice page */
  .q { font-size:26px; font-weight:600; padding:18px 16px 6px; line-height:1.4; }
  .countline { color:#8e8e93; font-size:14px; padding:0 16px 8px; }
  .ansBox { position:relative; margin:12px 16px; background:#fff; border-radius:12px; padding:16px; }
  .ansText { font-size:17px; line-height:1.6; transition:filter .2s; }
  .blurred { filter:blur(6px); }
  .ansOverlay {
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#007aff; font-size:15px; cursor:pointer; border-radius:12px;
  }
  .btnrow { display:flex; flex-wrap:wrap; gap:8px; padding:4px 16px 12px; }
  .smallbtn {
    border:none; background:#e9e9eb; color:#007aff; border-radius:9px; padding:8px 12px;
    font-size:14px; cursor:pointer;
  }
  .smallbtn:active { background:#d1d1d6; }

  .transBox {
    margin:12px 16px; background:#fff; border-radius:12px; padding:16px; min-height:90px;
    font-size:17px; line-height:1.6; color:#000;
  }
  .transPlaceholder { color:#c7c7cc; }
  .recBig {
    display:block; width:72px; height:72px; border-radius:50%; background:#007aff; border:none;
    margin:18px auto; color:#fff; font-size:26px; cursor:pointer;
    box-shadow:0 4px 14px rgba(0,122,255,.35);
  }
  .recBig:active { background:#005bb5; transform:scale(.95); }
  .hint { text-align:center; color:#8e8e93; font-size:13px; }

  .cmp { margin:12px 16px; background:#fff; border-radius:12px; padding:4px 0; }
  .cmp .crow { padding:12px 16px; font-size:15px; line-height:1.5; }
  .cmp .label { font-weight:600; color:#8e8e93; margin-right:6px; }

  /* modal */
  .mask {
    position:fixed; inset:0; background:rgba(0,0,0,.35); display:none;
    align-items:center; justify-content:center; z-index:50;
  }
  .sheet {
    background:#fff; border-radius:14px; width:300px; padding:18px;
  }
  .sheet h3 { font-size:17px; text-align:center; margin-bottom:12px; }
  .sheet input, .sheet textarea {
    width:100%; border:1px solid #e5e5ea; border-radius:8px; padding:10px; font-size:16px;
    font-family:inherit;
  }
  .sheet textarea { min-height:100px; resize:vertical; }
  .sheet .btns { display:flex; gap:10px; margin-top:14px; }
  .sheet .btns button {
    flex:1; border:none; border-radius:9px; padding:10px; font-size:16px; cursor:pointer;
  }
  .ok { background:#007aff; color:#fff; }
  .cancel { background:#e9e9eb; color:#000; }
  .menuItem { padding:12px 0; text-align:center; font-size:17px; color:#007aff; cursor:pointer; }
  .toast {
    position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
    background:rgba(0,0,0,.7); color:#fff; padding:8px 16px; border-radius:18px;
    font-size:14px; display:none; z-index:60;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="navrow"><button id="backBtn">‹ 返回</button></div>
    <h1 id="pageTitle">复述肌</h1>
    <div class="code" id="brandCode">RECALL</div>
  </header>
  <div id="content"></div>
</div>

<div class="mask" id="modalMask">
  <div class="sheet" id="modalSheet"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ---------- IndexedDB ----------
const DB_NAME = 'RecallDB';
const DB_VERSION = 1;
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('categories')) {
        db.createObjectStore('categories', { keyPath: 'id', autoIncrement: true });
      }
      if (!db.objectStoreNames.contains('groups')) {
        const g = db.createObjectStore('groups', { keyPath: 'id', autoIncrement: true });
        g.createIndex('categoryId', 'categoryId', { unique: false });
      }
      if (!db.objectStoreNames.contains('cards')) {
        const c = db.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
        c.createIndex('groupId', 'groupId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
function tx(store, mode, fn) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    const req = fn(s);
    t.oncomplete = () => resolve(req && req.result !== undefined ? req.result : undefined);
    t.onerror = () => reject(t.error);
  }));
}
const dbAll = (store) => tx(store, 'readonly', s => s.getAll());
const dbGet = (store, id) => tx(store, 'readonly', s => s.get(id));
const dbAdd = (store, obj) => tx(store, 'readwrite', s => s.add(obj));
const dbPut = (store, obj) => tx(store, 'readwrite', s => s.put(obj));
const dbDel = (store, id) => tx(store, 'readwrite', s => s.delete(id));
const dbByIndex = (store, index, val) => tx(store, 'readonly', s => s.index(index).getAll(val));

async function ensureSeed() {
  const cats = await dbAll('categories');
  if (cats.length > 0) return;
  const work = await dbAdd('categories', { name: '工作' });
  await dbAdd('categories', { name: '文案' });
  await dbAdd('categories', { name: '其他' });
  const g1 = await dbAdd('groups', { categoryId: work, name: '邀约语料' });
  await dbAdd('groups', { categoryId: work, name: '对抗说辞' });
  await dbAdd('groups', { categoryId: work, name: '思维整理' });
  await dbAdd('cards', { groupId: g1, question: '示例：如何邀请同事参加周末聚会？', answer: '', practiceCount: 0 });
}

// ---------- counts ----------
async function cardCountForGroup(groupId) {
  const cards = await dbByIndex('cards', 'groupId', groupId);
  return cards.reduce((a, c) => a + (c.practiceCount || 0), 0);
}
async function groupIdsOfCategory(categoryId) {
  const groups = await dbByIndex('groups', 'categoryId', categoryId);
  return groups.map(g => g.id);
}
async function countForCategory(categoryId) {
  const gids = await groupIdsOfCategory(categoryId);
  let total = 0;
  for (const gid of gids) total += await cardCountForGroup(gid);
  return total;
}
async function totalCardsPractice() {
  const cards = await dbAll('cards');
  return cards.reduce((a, c) => a + (c.practiceCount || 0), 0);
}

// ---------- navigation ----------
// stack entries: {view:'categories'} | {view:'groups',categoryId,title} | {view:'cards',groupId,title} | {view:'practice',cardId,title}
let stack = [{ view: 'categories' }];
const content = document.getElementById('content');
const titleEl = document.getElementById('pageTitle');
const backBtn = document.getElementById('backBtn');
const brandCode = document.getElementById('brandCode');

backBtn.onclick = () => { stack.pop(); render(); };

async function render() {
  const top = stack[stack.length - 1];
  backBtn.style.display = stack.length > 1 ? 'inline-block' : 'none';
  brandCode.style.display = top.view === 'categories' ? 'block' : 'none';
  if (top.view === 'categories') { titleEl.textContent = '复述肌'; return renderCategories(); }
  if (top.view === 'groups') { titleEl.textContent = top.title; return renderGroups(top); }
  if (top.view === 'cards') { titleEl.textContent = top.title; return renderCards(top); }
  if (top.view === 'practice') { titleEl.textContent = '练习'; return renderPractice(top); }
}

// ---------- row with swipe-delete + long-press rename ----------
function makeRow(label, countText, chevron, onTap, onDelete, onRename) {
  const wrap = document.createElement('div');
  wrap.className = 'row-wrap';
  const del = document.createElement('button');
  del.className = 'delbtn'; del.textContent = '删除';
  del.onclick = (e) => { e.stopPropagation(); onDelete(); };
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<div class="left"></div><div class="count"></div>${chevron ? '<div class="chev">›</div>' : ''}`;
  row.querySelector('.left').textContent = label;
  row.querySelector('.count').textContent = countText;
  wrap.appendChild(del); wrap.appendChild(row);

  let startX = 0, curX = 0, swiping = false, open = false, longTimer = null, moved = false;
  function close() { row.style.transform = 'translateX(0)'; open = false; }
  row.addEventListener('touchstart', (e) => {
    startX = e.touches[0].clientX; curX = 0; moved = false;
    longTimer = setTimeout(() => { if (!moved) onRename(); }, 600);
  }, { passive: true });
  row.addEventListener('touchmove', (e) => {
    const dx = e.touches[0].clientX - startX;
    if (Math.abs(dx) > 8) { moved = true; clearTimeout(longTimer); }
    if (dx < 0) { curX = Math.max(dx, -84); row.style.transform = `translateX(${curX}px)`; swiping = true; }
  }, { passive: true });
  row.addEventListener('touchend', () => {
    clearTimeout(longTimer);
    if (swiping) {
      if (curX < -42) { row.style.transform = 'translateX(-84px)'; open = true; }
      else close();
      swiping = false;
    } else if (!moved) {
      if (open) close();
      else onTap();
    }
  });
  row.addEventListener('mousedown', (e) => {
    longTimer = setTimeout(() => onRename(), 600);
  });
  ['mouseup','mouseleave'].forEach(ev => row.addEventListener(ev, () => clearTimeout(longTimer)));
  row.addEventListener('click', (e) => { /* handled in touchend; mouse click fallback */ });
  row.addEventListener('contextmenu', e => e.preventDefault());
  // mouse fallback for tap
  let mdX = 0;
  row.addEventListener('mousedown', e => { mdX = e.clientX; });
  row.addEventListener('mouseup', e => {
    if (Math.abs(e.clientX - mdX) < 6) { clearTimeout(longTimer); if (open) close(); else onTap(); }
  });
  return { wrap, close };
}

function listCard() {
  const c = document.createElement('div');
  c.className = 'card';
  return c;
}

// ---------- modals ----------
const modalMask = document.getElementById('modalMask');
const modalSheet = document.getElementById('modalSheet');
function showModal(html) { modalSheet.innerHTML = html; modalMask.style.display = 'flex'; }
function hideModal() { modalMask.style.display = 'none'; modalSheet.innerHTML = ''; }
modalMask.addEventListener('click', (e) => { if (e.target === modalMask) hideModal(); });

function promptText(title, value, onOk, placeholder) {
  showModal(`<h3>${title}</h3><input id="mInput" value="${value ? value.replace(/"/g, '&quot;') : ''}" placeholder="${placeholder || ''}">
    <div class="btns"><button class="cancel" onclick="hideModal()">取消</button><button class="ok" id="mOk">确定</button></div>`);
  const inp = document.getElementById('mInput');
  inp.focus();
  document.getElementById('mOk').onclick = () => {
    const v = inp.value.trim();
    if (v) { hideModal(); onOk(v); }
  };
}
window.hideModal = hideModal;

function menuActions(onRename, onEdit) {
  showModal(`<div class="menuItem" id="mRename">重命名</div>
    <div class="menuItem" id="mEdit">编辑</div>
    <div class="btns"><button class="cancel" onclick="hideModal()">取消</button></div>`);
  document.getElementById('mRename').onclick = () => { hideModal(); onRename(); };
  document.getElementById('mEdit').onclick = () => { hideModal(); onEdit(); };
}

function editCard(card, onDone) {
  showModal(`<h3>编辑语料</h3>
    <input id="eQ" placeholder="标题" value="${(card.question || '').replace(/"/g, '&quot;')}" style="margin-bottom:8px">
    <textarea id="eA" placeholder="标准答案" style="margin-bottom:8px">${(card.answer || '').replace(/</g,'&lt;')}</textarea>
    <input id="eN" type="number" placeholder="练习次数" value="${card.practiceCount || 0}">
    <div class="btns"><button class="cancel" onclick="hideModal()">取消</button><button class="ok" id="mOk">保存</button></div>`);
  document.getElementById('mOk').onclick = async () => {
    card.question = document.getElementById('eQ').value.trim() || card.question;
    card.answer = document.getElementById('eA').value.trim();
    card.practiceCount = parseInt(document.getElementById('eN').value) || 0;
    await dbPut('cards', card); hideModal(); onDone();
  };
}

function editName(obj, store, title, onDone) {
  promptText('编辑：' + title, obj.name, async (v) => { obj.name = v; await dbPut(store, obj); onDone(); });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 1500);
}

// ---------- level 1: categories ----------
async function renderCategories() {
  const cats = await dbAll('categories');
  content.innerHTML = '';
  const card = listCard();
  for (let i = 0; i < cats.length; i++) {
    const cat = cats[i];
    const n = await countForCategory(cat.id);
    const { wrap } = makeRow(cat.name, String(n), true,
      () => { stack.push({ view: 'groups', categoryId: cat.id, title: cat.name }); render(); },
      async () => { await dbDel('categories', cat.id);
        const gs = await dbByIndex('groups', 'categoryId', cat.id);
        for (const g of gs) {
          const cs = await dbByIndex('cards', 'groupId', g.id);
          for (const c of cs) await dbDel('cards', c.id);
          await dbDel('groups', g.id);
        }
        render(); },
      () => menuActions(
        () => promptText('重命名', cat.name, async (v) => { cat.name = v; await dbPut('categories', cat); render(); }),
        () => editName(cat, 'categories', cat.name, render)
      )
    );
    card.appendChild(wrap);
    if (i < cats.length - 1) { const d = document.createElement('div'); d.className = 'divider'; card.appendChild(d); }
  }
  if (cats.length === 0) card.innerHTML = '<div class="empty">还没有分区</div>';
  content.appendChild(card);
  const add = document.createElement('div');
  add.className = 'addbox'; add.textContent = '＋ 新建分区';
  add.onclick = () => promptText('新建分区', '', async (v) => { await dbAdd('categories', { name: v }); render(); }, '分区名称');
  content.appendChild(add);
  const tip = document.createElement('div');
  tip.className = 'hint'; tip.style.marginTop = '10px';
  tip.textContent = '提示：长按某行可重命名 / 编辑';
  content.appendChild(tip);
}

// ---------- level 2: groups ----------
async function renderGroups(top) {
  const groups = await dbByIndex('groups', 'categoryId', top.categoryId);
  content.innerHTML = '';
  const card = listCard();
  for (let i = 0; i < groups.length; i++) {
    const g = groups[i];
    const n = await cardCountForGroup(g.id);
    const { wrap } = makeRow(g.name, String(n), true,
      () => { stack.push({ view: 'cards', groupId: g.id, title: g.name }); render(); },
      async () => { await dbDel('groups', g.id);
        const cs = await dbByIndex('cards', 'groupId', g.id);
        for (const c of cs) await dbDel('cards', c.id);
        render(); },
      () => menuActions(
        () => promptText('重命名', g.name, async (v) => { g.name = v; await dbPut('groups', g); render(); }),
        () => editName(g, 'groups', g.name, render)
      )
    );
    card.appendChild(wrap);
    if (i < groups.length - 1) { const d = document.createElement('div'); d.className = 'divider'; card.appendChild(d); }
  }
  if (groups.length === 0) card.innerHTML = '<div class="empty">还没有分组</div>';
  content.appendChild(card);
  const add = document.createElement('div');
  add.className = 'addbox'; add.textContent = '＋ 新建分组';
  add.onclick = () => promptText('新建分组', '', async (v) => { await dbAdd('groups', { categoryId: top.categoryId, name: v }); render(); }, '分组名称');
  content.appendChild(add);
  const tip = document.createElement('div');
  tip.className = 'hint'; tip.style.marginTop = '10px';
  tip.textContent = '提示：长按某行可重命名 / 编辑';
  content.appendChild(tip);
}

// ---------- level 3: cards ----------
async function renderCards(top) {
  const cards = await dbByIndex('cards', 'groupId', top.groupId);
  content.innerHTML = '';
  const card = listCard();
  for (let i = 0; i < cards.length; i++) {
    const c = cards[i];
    const { wrap } = makeRow(c.question, String(c.practiceCount || 0), true,
      () => { stack.push({ view: 'practice', cardId: c.id, title: c.question }); render(); },
      async () => { await dbDel('cards', c.id); render(); },
      () => menuActions(
        () => promptText('重命名（标题）', c.question, async (v) => { c.question = v; await dbPut('cards', c); render(); }),
        () => editCard(c, render)
      )
    );
    card.appendChild(wrap);
    if (i < cards.length - 1) { const d = document.createElement('div'); d.className = 'divider'; card.appendChild(d); }
  }
  if (cards.length === 0) card.innerHTML = '<div class="empty">还没有语料</div>';
  content.appendChild(card);
  const add = document.createElement('div');
  add.className = 'addbox'; add.textContent = '＋ 新建语料';
  add.onclick = () => promptText('新建语料', '', async (v) => { await dbAdd('cards', { groupId: top.groupId, question: v, answer: '', practiceCount: 0 }); render(); }, '题目/标题');
  content.appendChild(add);
  const tip = document.createElement('div');
  tip.className = 'hint'; tip.style.marginTop = '10px';
  tip.textContent = '提示：长按某行可重命名 / 编辑';
  content.appendChild(tip);
}

// ---------- speech ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function recognizeOnce(onText, onEnd) {
  if (!SR) { toast('当前浏览器不支持语音识别'); onEnd && onEnd(); return null; }
  const rec = new SR();
  rec.lang = 'zh-CN';
  rec.continuous = true;
  rec.interimResults = true;
  let finalText = '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    onText(finalText + interim);
  };
  rec.onerror = () => {};
  rec.onend = () => onEnd && onEnd(finalText);
  rec.start();
  return rec;
}

// ---------- practice page ----------
let practiceState = { reveal: false, lastTranscript: '' };
async function renderPractice(top) {
  const card = await dbGet('cards', top.cardId);
  if (!card) { stack.pop(); render(); return; }
  practiceState = { reveal: false, lastTranscript: '' };
  content.innerHTML = `
    <div class="q"></div>
    <div class="countline">累计练习：<span id="pc">${card.practiceCount || 0}</span> 次</div>
    <div class="ansBox">
      <div class="ansText ${card.answer ? '' : ''}" id="ansText"></div>
      <div class="ansOverlay" id="ansOverlay">👆 点击显示标准答案</div>
    </div>
    <div class="btnrow">
      <button class="smallbtn" id="recAnsBtn">🎙 按住录制标准答案</button>
      <button class="smallbtn" id="toggleAnsBtn">隐藏标准答案</button>
      <button class="smallbtn" id="editAnsBtn">手动编辑文字</button>
    </div>
    <div class="transBox"><span id="transText" class="transPlaceholder">按住下方按钮开始说话...</span></div>
    <button class="recBig" id="recBtn">🎙</button>
    <div class="hint">按住说话，松手转写</div>
    <div id="cmpWrap"></div>
  `;
  content.querySelector('.q').textContent = card.question;
  const ansText = document.getElementById('ansText');
  const ansOverlay = document.getElementById('ansOverlay');
  ansText.textContent = card.answer || '（还没有标准答案，请录制或编辑）';
  ansText.classList.add('blurred');
  ansOverlay.style.display = card.answer ? 'flex' : 'none';

  ansOverlay.onclick = () => { ansText.classList.remove('blurred'); ansOverlay.style.display = 'none'; practiceState.reveal = true; };
  document.getElementById('toggleAnsBtn').onclick = () => {
    if (ansText.classList.contains('blurred')) {
      ansText.classList.remove('blurred'); ansOverlay.style.display = 'none';
    } else {
      ansText.classList.add('blurred'); ansOverlay.style.display = card.answer ? 'flex' : 'none';
    }
  };
  document.getElementById('editAnsBtn').onclick = () => {
    showModal(`<h3>编辑标准答案</h3><textarea id="mArea">${(card.answer || '').replace(/</g,'&lt;')}</textarea>
      <div class="btns"><button class="cancel" onclick="hideModal()">取消</button><button class="ok" id="mOk">保存</button></div>`);
    document.getElementById('mOk').onclick = async () => {
      card.answer = document.getElementById('mArea').value.trim();
      await dbPut('cards', card); hideModal(); renderPractice(top);
    };
  };

  // record answer
  const recAnsBtn = document.getElementById('recAnsBtn');
  let ansRec = null;
  const startAns = (e) => {
    e.preventDefault();
    ansText.classList.remove('blurred'); ansOverlay.style.display = 'none';
    ansText.textContent = '正在听...';
    ansRec = recognizeOnce((t) => { ansText.textContent = t; }, async (final) => {
      const text = (final || ansText.textContent || '').trim();
      if (text && text !== '正在听...') {
        card.answer = text; await dbPut('cards', card);
        ansText.textContent = text;
        ansText.classList.add('blurred');
        ansOverlay.style.display = 'flex';
        toast('标准答案已保存');
      } else {
        ansText.textContent = card.answer || '（还没有标准答案，请录制或编辑）';
        ansText.classList.add('blurred');
        ansOverlay.style.display = card.answer ? 'flex' : 'none';
        toast('未识别到语音');
      }
    });
  };
  const endAns = (e) => { e.preventDefault(); if (ansRec) { try { ansRec.stop(); } catch(_){} ansRec = null; } };
  recAnsBtn.addEventListener('touchstart', startAns, { passive: false });
  recAnsBtn.addEventListener('touchend', endAns, { passive: false });
  recAnsBtn.addEventListener('mousedown', startAns);
  recAnsBtn.addEventListener('mouseup', endAns);

  // practice record
  const recBtn = document.getElementById('recBtn');
  const transText = document.getElementById('transText');
  let userRec = null;
  const startUser = (e) => {
    e.preventDefault();
    transText.classList.remove('transPlaceholder');
    transText.textContent = '正在听...';
    userRec = recognizeOnce((t) => { transText.textContent = t; }, async (final) => {
      const text = (final || '').trim() || (transText.textContent !== '正在听...' ? transText.textContent.trim() : '');
      if (text && text !== '正在听...' ) {
        transText.textContent = text;
        card.practiceCount = (card.practiceCount || 0) + 1;
        await dbPut('cards', card);
        document.getElementById('pc').textContent = card.practiceCount;
        const cmpWrap = document.getElementById('cmpWrap');
        cmpWrap.innerHTML = `<div class="cmp">
          <div class="crow"><span class="label">标准</span><span class="cStd"></span></div>
          <div class="divider"></div>
          <div class="crow"><span class="label">我</span><span class="cMe"></span></div>
        </div>`;
        cmpWrap.querySelector('.cStd').textContent = card.answer || '（无标准答案）';
        cmpWrap.querySelector('.cMe').textContent = text;
      } else {
        transText.textContent = '按住下方按钮开始说话...';
        transText.classList.add('transPlaceholder');
        toast('未识别到语音');
      }
    });
  };
  const endUser = (e) => { e.preventDefault(); if (userRec) { try { userRec.stop(); } catch(_){} userRec = null; } };
  recBtn.addEventListener('touchstart', startUser, { passive: false });
  recBtn.addEventListener('touchend', endUser, { passive: false });
  recBtn.addEventListener('mousedown', startUser);
  recBtn.addEventListener('mouseup', endUser);
}

// ---------- boot ----------
ensureSeed().then(render);
</script>
</body>
</html>
